document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t:500;\">برعاية ارتقاء × تحوّل<\u002Fp>\n      <h1 style=\"text-align:center;color:#03045D;font-size:24px;font-weight:800;margin:0 0 6px;\">منصة إثراء الوطنية<\u002Fh1>\n      <p style=\"text-align:center;color:#03045D;opacity:0.65;font-size:14.5px;margin:0 0 30px;font-weight:400;\">لتبادل الخبرات والمعرفة في التحول الرقمي الوطني<\u002Fp>\n\n      <div style=\"font-size:13px;font-weight:700;color:#03045D;margin-bottom:10px;\">اختر دورك للدخول التجريبي<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;\">\n        <sc-for list=\"{{ roleOptions }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ r.onSelect }}\" style=\"{{ r.cardStyle }}\">\n            <span style=\"font-size:14px;font-weight:700;display:block;\">{{ r.label }}<\u002Fspan>\n            <span style=\"font-size:11.5px;opacity:0.7;display:block;margin-top:3px;font-weight:400;\">{{ r.hint }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <button onclick=\"{{ login }}\" style=\"width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#03045D,#A12B7E);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(161,43,126,0.35);\">دخول إلى المنصة<\u002Fbutton>\n      <p style=\"text-align:center;color:#03045D;opacity:0.4;font-size:11px;margin:16px 0 0;\">نموذج تجريبي — جميع البيانات وهمية ولأغراض العرض فقط<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;min-height:100vh;width:100%;\">\n\n  <!-- Sidebar (right in RTL) -->\n  <div style=\"width:260px;flex:none;background:#03045D;min-height:100vh;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(183,197,229,0.2);margin-bottom:18px;\">\n ign-items:center;justify-content:space-between;\">\n                    <div style=\"font-size:11.5px;color:#03045D;opacity:0.55;\">{{ an.author }} · {{ an.votes }} صوت<\u002Fdiv>\n                    <sc-if value=\"{{ an.showAccept }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button onclick=\"{{ an.onAccept }}\" style=\"padding:6px 12px;border-radius:8px;border:none;background:#F3F7FF;color:#03045D;font-size:11px;font-weight:700;cursor:pointer;\">اعتماد كإجابة<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 14px rgba(3,4,93,0.06);\">\n              <div style=\"font-size:13.5px;font-weight:700;color:#03045D;margin-bottom:10px;\">أضف إجابتك<\u002Fdiv>\n              <textarea value=\"{{ newAnswerText }}\" oninput=\"{{ onNewAnswerInput }}\" placeholder=\"اكتب إجابتك هنا…\" style=\"width:100%;min-height:90px;padding:12px 14px;border-radius:10px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;resize:vertical;margin-bottom:10px;\"><\u002Ftextarea>\n              <button onclick=\"{{ submitAnswer }}\" style=\"padding:10px 20px;border-radius:9px;border:none;background:#03045D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;\">نشر الإجابة<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAssistant }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"المساعد المعرفي\" style=\"animation:fadeIn 0.35s ease;max-width:760px;margin:0 auto;\">\n          <h2 style=\"font-size:20px;font-weight:800;color:#03045D;margin:0 0 4px;\">المساعد المعرفي الذكي<\u002Fh2>\n          <p style=\"font-size:13px;color:#03045D;opacity:0.6;margin:0 0 20px;\">اسأل عن مشاريع سابقة أو خبراء متخصصين واحصل على توصيات فورية<\u002Fp>\n\n          <div style=\"background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(3,4,93,0.06);display:flex;flex-direction:column;height:520px;overflow:hidden;\">\n            <div style=\"flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;\">\n              <sc-for list=\"{{ chatBubbles }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"max-width:78%;align-self:{{ m.align }};background:{{ m.bg }};color:{{ m.color }};padding:12px 16px;border-radius:14px;font-size:13.5px;line-height:1.8;white-space:pre-line;\">{{ m.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding:14px 22px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(3,4,93,0.06);\">\n              <sc-for list=\"{{ suggestedChips }}\" as=\"sc\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ sc.onClick }}\" style=\"padding:8px 14px;border-radius:20px;border:1px solid rgba(2,166,188,0.3);background:#F3F7FF;color:#02A6BC;font-size:11.5px;font-weight:600;cursor:pointer;\">{{ sc.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding:16px 22px;border-top:1px solid rgba(3,4,93,0.08);display:flex;gap:10px;\">\n              <input value=\"{{ chatInput }}\" oninput=\"{{ onChatInput }}\" onkeydown=\"{{ onChatKeydown }}\" placeholder=\"اكتب سؤالك هنا…\" style=\"flex:1;padding:12px 16px;border-radius:10px;border:1px solid rgba(3,4,93,0.15);font-size:13.5px;color:#03045D;\">\n              <button onclick=\"{{ sendChat }}\" style=\"padding:12px 22px;border-radius:10px;border:none;background:#03045D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;\">إرسال<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAdminSection }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"الإدارة والحوكمة\" style=\"animation:fadeIn 0.35s ease;\">\n          <h2 style=\"font-size:20px;font-weight:800;color:#03045D;margin:0 0 4px;\">الإدارة والحوكمة<\u002Fh2>\n          <p style=\"font-size:13px;color:#03045D;opacity:0.6;margin:0 0 22px;\">الأدوار، تصنيف حساسية البيانات، وسجل التدقيق — متاحة لمدير النظام فقط<\u002Fp>\n\n          <div style=\"background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 14px rgba(3,4,93,0.06);margin-bottom:18px;\">\n            <div style=\"font-size:15px;font-weight:800;color:#03045D;margin-bottom:14px;\">الأدوار والصلاحيات<\u002Fdiv>\n            <sc-for list=\"{{ roleRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"padding:12px 0;border-top:1px solid rgba(3,4,93,0.06);\">\n                <div style=\"font-size:13.5px;font-weight:700;color:#03045D;margin-bottom:6px;\">{{ r.label }}<\u002Fdiv>\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n                  <sc-for list=\"{{ r.permChips }}\" as=\"pc\" hint-placeholder-count=\"3\">\n                    <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:#F3F7FF;color:#03045D;opacity:0.75;\">{{ pc }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n            <div style=\"background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 14px rgba(3,4,93,0.06);\">\n              <div style=\"font-size:15px;font-weight:800;color:#03045D;margin-bottom:14px;\">تصنيف حساسية البيانات<\u002Fdiv>\n              <sc-for list=\"{{ classificationRows }}\" as=\"cl\" hint-placeholder-count=\"3\">\n                <div style=\"padding:12px 0;border-top:1px solid rgba(3,4,93,0.06);\">\n                  <span style=\"font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:{{ cl.bg }};color:{{ cl.color }};\">{{ cl.label }}<\u002Fspan>\n                  <div style=\"font-size:12.5px;color:#03045D;opacity:0.7;margin-top:8px;line-height:1.7;\">{{ cl.description }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 14px rgba(3,4,93,0.06);\">\n              <div style=\"font-size:15px;font-weight:800;color:#03045D;margin-bottom:14px;\">سجل التدقيق (Audit Log)<\u002Fdiv>\n              <sc-for list=\"{{ auditRows }}\" as=\"au\" hint-placeholder-count=\"5\">\n                <div style=\"padding:10px 0;border-top:1px solid rgba(3,4,93,0.06);\">\n                  <div style=\"font-size:12.5px;font-weight:700;color:#03045D;\">{{ au.actor }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#03045D;opacity:0.65;margin:2px 0;\">{{ au.action }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#02A6BC;\">{{ au.time }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Project detail slide-over -->\n  <sc-if value=\"{{ detailProject }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(3,4,93,0.35);z-index:100;display:flex;justify-content:flex-end;\" onclick=\"{{ closeDetailBackdrop }}\">\n      <div onclick=\"{{ stopClick }}\" style=\"width:520px;max-width:92vw;background:#fff;height:100vh;overflow-y:auto;padding:28px;box-shadow:-20px 0 60px rgba(3,4,93,0.3);animation:slideIn 0.25s ease;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;\">\n          <div>\n            <span style=\"font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:#F3F7FF;color:#03045D;\">{{ detailProject.type }}<\u002Fspan>\n            <h2 style=\"font-size:19px;font-weight:800;color:#03045D;margin:10px 0 4px;\">{{ detailProject.name }}<\u002Fh2>\n            <div style=\"font-size:12.5px;color:#02A6BC;font-weight:600;\">{{ detailProject.owner }} · {{ detailProject.sector }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeDetail }}\" style=\"width:34px;height:34px;border-radius:9px;border:none;background:#F3F7FF;color:#03045D;font-size:16px;cursor:pointer;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <p style=\"font-size:13.5px;color:#03045D;opacity:0.8;line-height:1.8;margin:0 0 18px;\">{{ detailProject.description }}<\u002Fp>\n\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px;\">\n          <span style=\"font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:{{ detailProject.statusBg }};color:{{ detailProject.statusColor }};\">{{ detailProject.status }}<\u002Fspan>\n          <div style=\"flex:1;height:7px;border-radius:5px;background:#F3F7FF;overflow:hidden;\"><div style=\"height:100%;background:#02A6BC;width:{{ detailProject.completion }}%;\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:#03045D;font-weight:700;\">{{ detailProject.completion }}٪<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ detailProject.highRisk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:rgba(217,45,32,0.1);color:#d92d20;font-size:12.5px;font-weight:700;margin-bottom:18px;\">\n            ⚠ تنبيه: هذا المشروع يحتوي على مخاطرة عالية الاحتمالية وعالية الأثر قيد المتابعة\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;\">\n          <div><div style=\"font-size:11px;color:#A12B7E;font-weight:700;margin-bottom:4px;\">الميزانية<\u002Fdiv><div style=\"font-size:13px;color:#03045D;\">{{ detailProject.budget }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:11px;color:#A12B7E;font-weight:700;margin-bottom:4px;\">مدة التنفيذ<\u002Fdiv><div style=\"font-size:13px;color:#03045D;\">{{ detailProject.duration }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"grid-column:span 2;\"><div style=\"font-size:11px;color:#A12B7E;font-weight:700;margin-bottom:4px;\">الربط بالاستراتيجية الوطنية<\u002Fdiv><div style=\"font-size:13px;color:#03045D;\">{{ detailProject.strategyLink }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:6px;\">الأهداف<\u002Fdiv>\n          <sc-for list=\"{{ detailProject.goalsList }}\" as=\"g\" hint-placeholder-count=\"3\"><div style=\"font-size:12.5px;color:#03045D;opacity:0.8;padding:3px 0;\">• {{ g }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:6px;\">مؤشرات النجاح<\u002Fdiv>\n          <sc-for list=\"{{ detailProject.successList }}\" as=\"g\" hint-placeholder-count=\"3\"><div style=\"font-size:12.5px;color:#03045D;opacity:0.8;padding:3px 0;\">• {{ g }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;\">\n          <sc-for list=\"{{ detailProject.techChips }}\" as=\"t\" hint-placeholder-count=\"3\"><span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:#F3F7FF;color:#02A6BC;\">{{ t }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:8px;\">مراحل المشروع<\u002Fdiv>\n          <sc-for list=\"{{ detailProject.phaseRows }}\" as=\"ph\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:7px 0;\">\n              <span style=\"width:9px;height:9px;border-radius:50%;background:{{ ph.dotColor }};flex:none;\"><\u002Fspan>\n              <span style=\"font-size:12.5px;color:#03045D;flex:1;\">{{ ph.name }}<\u002Fspan>\n              <span style=\"font-size:10.5px;font-weight:700;color:{{ ph.dotColor }};\">{{ ph.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:8px;\">التحديات والحلول<\u002Fdiv>\n          <sc-for list=\"{{ detailProject.challengeRows }}\" as=\"ch\" hint-placeholder-count=\"2\">\n            <div style=\"background:#F3F7FF;border-radius:10px;padding:10px 12px;margin-bottom:8px;\">\n              <div style=\"font-size:12px;color:#03045D;font-weight:700;margin-bottom:3px;\">التحدي: {{ ch.challenge }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#03045D;opacity:0.75;\">الحل: {{ ch.solution }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:8px;\">فريق إدارة المشروع<\u002Fdiv>\n          <sc-for list=\"{{ detailProject.teamRows }}\" as=\"tm\" hint-placeholder-count=\"2\">\n            <div style=\"font-size:12.5px;color:#03045D;padding:3px 0;\">{{ tm.name }} — <span style=\"opacity:0.65;\">{{ tm.role }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:8px;\">الشركاء<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n            <sc-for list=\"{{ detailProject.partnerChips }}\" as=\"pt\" hint-placeholder-count=\"2\"><span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:#F3F7FF;color:#03045D;\">{{ pt }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:8px;\">الوثائق المرفقة<\u002Fdiv>\n          <sc-for list=\"{{ detailProject.docRows }}\" as=\"dc\" hint-placeholder-count=\"2\"><div style=\"font-size:12.5px;color:#03045D;opacity:0.75;padding:3px 0;\">📄 {{ dc }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ detailProject.hasRisks }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom:16px;\">\n            <div style=\"font-size:12px;color:#A12B7E;font-weight:700;margin-bottom:6px;\">آلية إدارة المخاطر<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#03045D;opacity:0.8;line-height:1.7;margin-bottom:10px;\">{{ detailProject.riskManagementApproach }}<\u002Fdiv>\n            <sc-for list=\"{{ detailProject.riskRows }}\" as=\"rk\" hint-placeholder-count=\"2\">\n              <div style=\"background:#F3F7FF;border-radius:10px;padding:10px 12px;margin-bottom:8px;\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;\">\n                  <span style=\"font-size:12px;color:#03045D;font-weight:700;\">{{ rk.risk }}<\u002Fspan>\n                  <span style=\"font-size:10px;font-weight:700;color:{{ rk.statusColor }};white-space:nowrap;\">{{ rk.status }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#03045D;opacity:0.65;margin-bottom:4px;\">الاحتمالية: {{ rk.likelihood }} · الأثر: {{ rk.impact }} · المسؤول: {{ rk.owner }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#03045D;opacity:0.8;\">الإجراء المخفف: {{ rk.mitigation }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ detailProject.hasContracts }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom:16px;\">\n            <div style=\"font-size:12px;color:#A12B7E;font-weight:700;marg           <div style=\"grid-column:span 2;\">\n            <label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">التصنيف<\u002Flabel>\n            <input value=\"{{ lessonForm.category }}\" oninput=\"{{ onLFCategory }}\" placeholder=\"مثال: إدارة بيانات، تجربة مستخدم…\" style=\"width:100%;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;\">\n          <\u002Fdiv>\n          <div style=\"grid-column:span 2;\"><label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">سبب المشكلة<\u002Flabel><textarea value=\"{{ lessonForm.cause }}\" oninput=\"{{ onLFCause }}\" style=\"width:100%;min-height:55px;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;resize:vertical;\"><\u002Ftextarea><\u002Fdiv>\n          <div style=\"grid-column:span 2;\"><label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">الإجراء المتخذ<\u002Flabel><textarea value=\"{{ lessonForm.action }}\" oninput=\"{{ onLFAction }}\" style=\"width:100%;min-height:55px;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;resize:vertical;\"><\u002Ftextarea><\u002Fdiv>\n          <div style=\"grid-column:span 2;\"><label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">النتيجة<\u002Flabel><textarea value=\"{{ lessonForm.result }}\" oninput=\"{{ onLFResult }}\" style=\"width:100%;min-height:55px;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;resize:vertical;\"><\u002Ftextarea><\u002Fdiv>\n          <div style=\"grid-column:span 2;\"><label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">التوصية<\u002Flabel><textarea value=\"{{ lessonForm.recommendation }}\" oninput=\"{{ onLFRecommendation }}\" style=\"width:100%;min-height:55px;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;resize:vertical;\"><\u002Ftextarea><\u002Fdiv>\n          <label style=\"grid-column:span 2;display:flex;align-items:center;gap:8px;font-size:13px;color:#03045D;cursor:pointer;\">\n            <input type=\"checkbox\" checked=\"{{ lessonForm.reusable }}\" onchange=\"{{ onLFReusable }}\">\n            قابل لإعادة الاستخدام في مشاريع أخرى\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;justify-content:flex-end;margin-top:20px;\">\n          <button onclick=\"{{ closeLessonModal }}\" style=\"padding:11px 20px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);background:#fff;color:#03045D;font-size:13px;font-weight:700;cursor:pointer;\">إلغاء<\u002Fbutton>\n          <button onclick=\"{{ saveLesson }}\" style=\"padding:11px 24px;border-radius:9px;border:none;background:#03045D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;\">حفظ الدرس<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- New question modal -->\n  <sc-if value=\"{{ questionModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(3,4,93,0.4);z-index:110;display:flex;align-items:center;justify-content:center;padding:20px;\" onclick=\"{{ closeQuestionModal }}\">\n      <div onclick=\"{{ stopClick }}\" style=\"width:560px;max-width:100%;background:#fff;border-radius:16px;padding:28px;box-shadow:0 30px 80px rgba(3,4,93,0.4);\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;\">\n          <h2 style=\"font-size:18px;font-weight:800;color:#03045D;margin:0;\">سؤال جديد<\u002Fh2>\n          <button onclick=\"{{ closeQuestionModal }}\" style=\"width:32px;height:32px;border-radius:8px;border:none;background:#F3F7FF;color:#03045D;cursor:pointer;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">عنوان السؤال<\u002Flabel>\n        <input value=\"{{ questionForm.title }}\" oninput=\"{{ onQFTitle }}\" style=\"width:100%;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;margin-bottom:14px;\">\n        <label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">تفاصيل السؤال<\u002Flabel>\n        <textarea value=\"{{ questionForm.body }}\" oninput=\"{{ onQFBody }}\" style=\"width:100%;min-height:100px;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;resize:vertical;margin-bottom:14px;\"><\u002Ftextarea>\n        <label style=\"font-size:12px;font-weight:700;color:#03045D;display:block;margin-bottom:5px;\">الوسوم (مفصولة بفاصلة)<\u002Flabel>\n        <input value=\"{{ questionForm.tags }}\" oninput=\"{{ onQFTags }}\" placeholder=\"مثال: صحة، بيانات\" style=\"width:100%;padding:10px 12px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);font-size:13px;color:#03045D;margin-bottom:20px;\">\n        <div style=\"display:flex;gap:10px;justify-content:flex-end;\">\n          <button onclick=\"{{ closeQuestionModal }}\" style=\"padding:11px 20px;border-radius:9px;border:1px solid rgba(3,4,93,0.15);background:#fff;color:#03045D;font-size:13px;font-weight:700;cursor:pointer;\">إلغاء<\u002Fbutton>\n          <button onclick=\"{{ saveQuestion }}\" style=\"padding:11px 24px;border-radius:9px;border:none;background:#03045D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;\">نشر السؤال<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Toast -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#03045D;color:#fff;padding:13px 24px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 14px 40px rgba(3,4,93,0.4);z-index:200;animation:toastIn 0.25s ease;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    currentUser: null,\n    selectedRole: 'org_user',\n    activeSection: 'dashboard',\n    projects: [],\n    lessons: [],\n    experts: [],\n    questions: [],\n    globalSearch: '',\n    notifOpen: false,\n\n    projSearch: '', projOwner: '', projSector: '', projStatus: '',\n    compareIds: [],\n    compareOpen: false,\n    detailProjectId: null,\n    projModalOpen: false, projEditId: null,\n    projForm: this.emptyProjectForm(),\n\n    lessonSearch: '', lessonCategory: '',\n    lessonModalOpen: false,\n    lessonForm: this.emptyLessonForm(),\n    recommendOpenId: null, recommendTargets: {},\n\n    librarySearch: '', libraryCategory: '',\n\n    questionSearch: '', questionSort: 'newest',\n    questionModalOpen: false,\n    questionForm: { title: '', body: '', tags: '' },\n    activeQuestionId: null, newAnswerText: '',\n\n    chatMessages: [{ role: 'assistant', text: 'مرحبًا! أنا المساعد المعرفي للمنصة. اسألني عن مشاريع سابقة أو خبراء متخصصين، مثل: \"ما مشاريع المستشفيات؟\" أو \"من الخبراء في الأمن السيبراني؟\"' }],\n    chatInput: '',\n\n    toast: null\n  };\n\n  emptyProjectForm() {\n    return {\n      name: '', type: 'مشروع', owner: '', sector: '', description: '',\n      goals: '', budget: '', duration: '', technologies: '', partners: '',\n      status: 'قيد التخطيط', completion: 0, successIndicators: '', strategyLink: '',\n      team: '', documents: '', contracts: '',\n      riskManagementApproach: '',\n      phasesList: [{ name: '', status: 'قادمة' }],\n      challengesList: [{ challenge: '', solution: '' }],\n      risksList: [{ risk: '', likelihood: 'متوسطة', impact: 'متوسط', mitigation: '', owner: '', status: 'قيد المتابعة' }]\n    };\n  }\n  emptyLessonForm() {\n    return { title: '', projectId: '', phaseName: '', category: '', cause: '', action: '', result: '', recommendation: '', reusable: false };\n  }\n\n  async componentDidMount() {\n    const mod = await import(window.__resources ? window.__resources.mockDataUrl : './mockData.js');\n    this._mock = mod;\n    this.setState({\n      projects: JSON.parse(JSON.stringify(mod.projects)),\n      lessons: JSON.parse(JSON.stringify(mod.lessons)),\n      experts: mod.experts,\n      questions: JSON.parse(JSON.stringify(mod.questions))\n    });\n  }\n\n  showToast(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => this.setState({ toast: null }), 2600);\n  }\n\n  // ---------- Auth ----------\n  login() {\n    const mock = this._mock;\n    const u = mock.users[this.state.selectedRole];\n    this.setState({ currentUser: u, activeSection: 'dashboard' });\n  }\n  logout() {\n    this.setState({ currentUser: null, activeSection: 'dashboard', detailProjectId: null, projModalOpen: false, lessonModalOpen: false, questionModalOpen: false, activeQuestionId: null, compareOpen: false, compareIds: [] });\n  }\n  canEditNow() { return this.state.currentUser && this.state.currentUser.role !== 'executive'; }\n  canApproveNow() { return this.state.currentUser && (this.state.currentUser.role === 'system_admin' || this.state.currentUser.role === 'data_steward'); }\n  isAdminNow() { return this.state.currentUser && this.state.currentUser.role === 'system_admin'; }\n\n  setSection(name) { this.setState({ activeSection: name, notifOpen: false }); }\n  toggleNotif() { this.setState({ notifOpen: !this.state.notifOpen }); }\n  stopClick(e) { e.stopPropagation(); }\n  onGlobalSearch(e) { this.setState({ globalSearch: e.target.value }); }\n\n  // ---------- Projects ----------\n  onProjSearch(e) { this.setState({ projSearch: e.target.value }); }\n  onProjSectorFilter(e) { this.setState({ projSector: e.target.value }); }\n  onProjStatusFilter(e) { this.setState({ projStatus: e.target.value }); }\n\n  filteredProjects() {\n    const { projects, projSearch, projSector, projStatus } = this.state;\n    const q = (projSearch || '').trim();\n    return projects.filter(p => {\n      if (q && !(p.name.includes(q) || p.owner.includes(q))) return false;\n      if (projSector && p.sector !== projSector) return false;\n      if (projStatus && p.status !== projStatus) return false;\n      return true;\n    });\n  }\n\n  toggleCompare(id) {\n    let ids = this.state.compareIds.slice();\n    if (ids.includes(id)) ids = ids.filter(x => x !== id);\n    else {\n      ids.push(id);\n      if (ids.length > 2) ids.shift();\n    }\n    this.setState({ compareIds: ids });\n  }\n  openCompare() { this.setState({ compareOpen: true }); }\n  closeCompare() { this.setState({ compareOpen: false }); }\n\n  openDetail(id) { this.setState({ detailProjectId: id }); }\n  closeDetail() { this.setState({ detailProjectId: null }); }\n  closeDetailBackdrop() { this.setState({ detailProjectId: null }); }\n\n  openAddProject() {\n    this.setState({ projModalOpen: true, projEditId: null, projForm: this.emptyProjectForm() });\n  }\n  openEditProject(id) {\n    const p = this.state.projects.find(x => x.id === id);\n    if (!p) return;\n    this.setState({\n      projModalOpen: true, projEditId: id,\n      projForm: {\n        name: p.name, type: p.type, owner: p.owner, sector: p.sector, description: p.description,\n        goals: (p.goals || []).join('\\n'), budget: p.budget, duration: p.duration,\n        technologies: (p.technologies || []).join('\\n'), partners: (p.partners || []).join('\\n'),\n        status: p.status, completion: p.completion, successIndicators: (p.successIndicators || []).join('\\n'),\n        strategyLink: p.strategyLink, team: (p.team || []).map(t => t.name + ' - ' + t.role).join('\\n'),\n        documents: (p.documents || []).join('\\n'), contracts: (p.contracts || []).join('\\n'),\n        riskManagementApproach: p.riskManagementApproach || '',\
